# Velosaurus full stack: database + rest api + frontend
# 1. copy .env.example to .env and set values
# 2. docker compose pull && docker compose up -d
name: velosaurus

services:
  # Database
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-velosaurus}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # only reachable from this machine (e.g. pgAdmin), containers use db:5432
    volumes:
      - db-data:/var/lib/postgresql # postgres 18+ stores data in a version subfolder below this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REST API: https://hub.docker.com/r/dasmuesli/velosaurus-backend
  api:
    image: dasmuesli/velosaurus-backend:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:6789"
    environment:
      ASPNETCORE_URLS: http://+:6789
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ActivityDbConnectionString: Host=db; Port=5432; Database=${POSTGRES_DB:-velosaurus}; User Id=${POSTGRES_USER:-postgres}; Password=${POSTGRES_PASSWORD}

  # Frontend
  frontend:
    image: dasmuesli/velosaurus-frontend:${FRONTEND_TAG:-latest}
    # TEMPORARY until frontend CI publishes the image to Docker Hub: build from sibling repo checkout
    build: ../velosaurus-frontend
    pull_policy: build
    # TEMPORARY end
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3001}:3042"
    environment:
      # server side calls go directly to the api container, not via the host
      ACTIVITY_API_URL: http://api:6789/api/v1/activity
      LOCATION_API_URL: http://api:6789/api/v1/location

volumes:
  db-data:
